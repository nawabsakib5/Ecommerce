{% extends 'core/base.html' %}

{% block title %}Delete Listing{% endblock %}

{% block content %}
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

<style>
    .bazaar-container {
        font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .bazaar-title {
        font-family: 'Playfair Display', serif;
    }
</style>

<div class="bazaar-container min-h-[75vh] flex items-center justify-center bg-[#f6f9fc] -mx-6 md:-mx-12 px-4 sm:px-6 lg:px-8 py-12 md:py-20 animate-fade-in">
    <div class="max-w-md w-full">
        
        <!-- Confirmation alert card -->
        <div class="bg-white p-8 md:p-10 rounded-[2.5rem] border border-slate-100 shadow-xl shadow-slate-200/50">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-rose-50 text-rose-500 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-rose-100">
                    <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                </div>
                <h3 class="bazaar-title text-2xl font-black text-[#0f172a] mb-2">Delete Listing</h3>
                <p class="text-slate-400 text-xs font-bold leading-relaxed">
                    Are you sure you want to permanently delete <span class="text-slate-600 font-extrabold">"{{ item.name }}"</span>? This action cannot be undone.
                </p>
            </div>
            
            <div class="flex gap-3">
                <form method="post" action="." class="flex-1">
                    {% csrf_token %}
                    <button type="submit"
                            class="w-full py-3.5 bg-rose-500 hover:bg-rose-600 text-white font-extrabold uppercase tracking-widest text-[10px] rounded-xl shadow-md shadow-rose-500/10 transition duration-300 transform active:scale-95">
                        Yes, Delete
                    </button>
                </form>
                <a href="{% url 'item:detail' item.id %}"
                   class="flex-1 py-3.5 bg-slate-50 border border-slate-200 hover:bg-[#f6f9fc] text-slate-700 font-extrabold text-[10px] uppercase tracking-widest rounded-xl transition text-center">
                    Cancel
                </a>
            </div>
        </div>

    </div>
</div>
{% endblock %}
