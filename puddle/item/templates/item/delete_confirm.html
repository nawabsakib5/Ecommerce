{% extends 'core/base.html' %}
{% block title %}Delete {{ item.name }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-16 bg-white p-8 md:p-10 rounded-[2.5rem] border border-[#EAF1DB] shadow-xl shadow-[#72A10F]/5 text-center animate-fade-in">
    
    <!-- Red Accent Warning Icon inside an Organic Styled Circle -->
    <div class="w-16 h-16 bg-rose-50 border border-rose-100 text-rose-500 rounded-3xl flex items-center justify-center mx-auto mb-6">
        <svg class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        </svg>
    </div>

    <!-- Title with Serif Font -->
    <h1 class="text-3xl font-black text-[#2C3E14] mb-3" style="font-family: 'Playfair Display', serif;">Delete Item</h1>
    
    <p class="text-stone-400 text-xs md:text-sm font-bold leading-relaxed mb-8">
        Are you sure you want to delete <span class="text-stone-700 font-extrabold">"{{ item.name }}"</span>?<br>
        This action is permanent and cannot be undone.
    </p>

    <form method="POST">
        {% csrf_token %}
        <div class="flex gap-3 justify-center">
            <!-- Cancel Button with Cozy Warm Sand Borders -->
            <a href="{% url 'item:detail' item.id %}" 
               class="flex-1 py-3.5 bg-stone-50 hover:bg-[#FAF8F5] border border-stone-200/60 text-stone-700 font-extrabold uppercase tracking-widest text-[10px] rounded-2xl transition-all duration-300 text-center">
                Cancel
            </a>
            <!-- Confirm Delete Button -->
            <button type="submit" 
                    class="flex-1 py-3.5 bg-rose-500 hover:bg-rose-600 text-white font-extrabold uppercase tracking-widest text-[10px] rounded-2xl shadow-md shadow-rose-500/10 transition-all duration-300 transform active:scale-95">
                Yes, Delete
            </button>
        </div>
    </form>
</div>
{% endblock %}
