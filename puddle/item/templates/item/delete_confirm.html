{% extends 'core/base.html' %}
{% block title %}Delete {{ item.name }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-20 bg-white p-8 rounded-3xl shadow-sm border border-gray-100 text-center">
    <h1 class="text-2xl font-black text-gray-900 mb-4">Delete Item</h1>
    <p class="text-gray-600 mb-8">
        Are you sure you want to delete <strong>{{ item.name }}</strong>? 
        This action cannot be undone.
    </p>
    <form method="POST">
        {% csrf_token %}
        <div class="flex gap-4 justify-center">
            <a href="{% url 'item:detail' item.id %}" 
               class="px-6 py-3 bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold rounded-xl transition-all">
                Cancel
            </a>
            <button type="submit" 
                    class="px-6 py-3 bg-rose-500 hover:bg-rose-600 text-white font-bold rounded-xl transition-all">
                Yes, Delete
            </button>
        </div>
    </form>
</div>
{% endblock %}
