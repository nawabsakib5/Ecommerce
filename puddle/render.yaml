services:
  - type: web
    name: ecommerce
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn puddle.wsgi:application
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: ecommerce-iyil.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://ecommerce-iyil.onrender.com
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false