{% extends "core/base.html" %}

{% block title %}Converastion{% endblock %}


{% block content %}

<h1 class = "mb-6 text-3xl">Converastion</h1>


<div class="space-y-6">
    {% for message in conversations.messages.all %}

        <div class="p-6 flex bg-grey-100 rounded-xl">
            <div>
                <p class="mb-4"><strong>{{ message.created__by.username }}</strong> @ {{ message.created_at }}</p>
                <p>{{ message.content }}</p>
            </div>
        </div>
    
    {% endfor %}
</div>
{% endblock %}
