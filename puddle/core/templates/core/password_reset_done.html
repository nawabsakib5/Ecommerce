{% extends 'core/base.html' %}
{% block title %}Email Sent | CADO Fashion{% endblock %}
{% block content %}
<style>
.pr { font-family:'Inter',sans-serif; background:#f8f7f4; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 16px; }
.pr-card { background:#fff; border:1.5px solid #e8e5e0; border-radius:24px; padding:40px; width:100%; max-width:420px; box-shadow:0 8px 32px rgba(0,0,0,.04); text-align:center; }
.pr-icon { font-size:40px; margin-bottom:12px; }
.pr-title { font-family:'Syne',sans-serif; font-size:24px; font-weight:800; color:#1a1a2e; margin-bottom:8px; }
.pr-sub { font-size:13px; color:#555; margin-bottom:24px; line-height:1.6; }
.pr-btn { display:inline-block; padding:12px 24px; background:#1a1a2e; color:#fff; border-radius:12px; font-size:12px; font-weight:700; text-decoration:none; transition:background .2s; }
.pr-btn:hover { background:#9A7432; }
</style>
<div class="pr">
<div class="pr-card">
  <div class="pr-icon">📧</div>
  <div class="pr-title">Check Your Email</div>
  <div class="pr-sub">We've sent a password reset link to your email. Please check your inbox and spam folder.</div>
  <a href="{% url 'core:login' %}" class="pr-btn">← Back to Login</a>
</div>
</div>
{% endblock %}
