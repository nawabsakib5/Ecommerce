{% extends 'core/base.html' %}
{% block title %}Reset Password | CADO Fashion{% endblock %}
{% block content %}
<style>
.pr { font-family:'Inter',sans-serif; background:#f8f7f4; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 16px; }
.pr-card { background:#fff; border:1.5px solid #e8e5e0; border-radius:24px; padding:40px; width:100%; max-width:420px; box-shadow:0 8px 32px rgba(0,0,0,.04); text-align:center; }
.pr-icon { font-size:40px; margin-bottom:12px; }
.pr-title { font-family:'Syne',sans-serif; font-size:24px; font-weight:800; color:#1a1a2e; margin-bottom:8px; }
.pr-sub { font-size:12px; color:#aaa; margin-bottom:24px; }
.pr-input { width:100%; padding:12px 14px; background:#f8f7f4; border:1.5px solid #e8e5e0; border-radius:11px; font-size:13px; outline:none; margin-bottom:16px; }
.pr-input:focus { border-color:#9A7432; background:#fff; }
.pr-btn { width:100%; padding:14px; background:#1a1a2e; color:#fff; border:none; border-radius:12px; font-size:13px; font-weight:700; cursor:pointer; transition:background .2s; }
.pr-btn:hover { background:#9A7432; }
.pr-back { display:block; margin-top:14px; font-size:12px; color:#aaa; text-decoration:none; }
.pr-back:hover { color:#c84b31; }
</style>
<div class="pr">
<div class="pr-card">
  <div class="pr-icon">🔐</div>
  <div class="pr-title">Reset Password</div>
  <div class="pr-sub">Enter your email and we'll send you a reset link.</div>
  <form method="post">
    {% csrf_token %}
    <input class="pr-input" type="email" name="email" placeholder="your@email.com" required>
    <button type="submit" class="pr-btn">📧 Send Reset Link</button>
  </form>
  <a href="{% url 'core:login' %}" class="pr-back">← Back to Login</a>
</div>
</div>
{% endblock %}
