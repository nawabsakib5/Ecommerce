{% extends 'core/base.html' %}
{% block title %}Password Reset Complete | CADO Fashion{% endblock %}
{% block content %}
<style>
.pr { font-family:'Inter',sans-serif; background:#f8f7f4; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 16px; }
.pr-card { background:#fff; border:1.5px solid #e8e5e0; border-radius:24px; padding:40px; width:100%; max-width:420px; box-shadow:0 8px 32px rgba(0,0,0,.04); text-align:center; }
.pr-icon { font-size:40px; margin-bottom:12px; }
.pr-title { font-family:'Syne',sans-serif; font-size:24px; font-weight:800; color:#1a1a2e; margin-bottom:8px; }
.pr-sub { font-size:13px; color:#555; margin-bottom:24px; }
.pr-btn { display:inline-block; padding:12px 24px; background:#c84b31; color:#fff; border-radius:12px; font-size:12px; font-weight:700; text-decoration:none; transition:background .2s; }
.pr-btn:hover { background:#b03d26; }
</style>
<div class="pr">
<div class="pr-card">
  <div class="pr-icon">🎉</div>
  <div class="pr-title">Password Reset!</div>
  <div class="pr-sub">Your password has been successfully reset. You can now login with your new password.</div>
  <a href="{% url 'core:login' %}" class="pr-btn">🔐 Login Now</a>
</div>
</div>
{% endblock %}
