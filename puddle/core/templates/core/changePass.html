{% extends 'core/base.html' %}

{% block title %}Change Password{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-10 bg-white p-8 rounded-2xl shadow-lg border border-gray-100">
    <h3 class="text-2xl font-bold text-gray-800 mb-6 text-center">Update Your Password</h3>

    <form action="." method="POST" class="space-y-5">
        {% csrf_token %}
        
        <div>
            <label for="old_pass" class="block text-sm font-medium text-gray-700 mb-1">Old Password</label>
            <input type="password" id="old_pass" name="old_pass" placeholder="Enter current password" 
                class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none transition-all">
        </div>

        <div>
            <label for="new_pass" class="block text-sm font-medium text-gray-700 mb-1">New Password</label>
            <input type="password" id="new_pass" name="new_pass" placeholder="Enter new password" 
                class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none transition-all">
        </div>

        <div>
            <label for="con_pass" class="block text-sm font-medium text-gray-700 mb-1">Confirm New Password</label>
            <input type="password" id="con_pass" name="con_pass" placeholder="Repeat new password" 
                class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none transition-all">
        </div>

        <button type="submit" 
            class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 px-4 rounded-xl transition-colors duration-300 shadow-md">
            Update Password
        </button>
    </form>

    <div class="mt-6 text-center">
        <a href="{% url 'core:index' %}" class="text-sm text-gray-500 hover:text-teal-600 underline">Cancel and go back</a>
    </div>
</div>
{% endblock %}
