{% extends 'core/base.html' %}

{% block title %}Change Password{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-16 px-6">
    <!-- Card component with soft ivory border and subtle organic shadow -->
    <div class="bg-white p-8 md:p-10 rounded-[2.5rem] border border-[#EAF1DB] shadow-xl shadow-[#72A10F]/5">
        <div class="text-center mb-8">
            <span class="inline-block text-2xl mb-2">🔒</span>
            <h1 class="text-3xl font-black text-[#2C3E14] tracking-tight" style="font-family: 'Playfair Display', serif;">Security</h1>
            <p class="text-stone-400 text-xs font-bold mt-2">আপনার পাসওয়ার্ড আপডেট করুন</p>
        </div>

        <form method="POST" action="." class="space-y-6">
            {% csrf_token %}
            
            <!-- Current Password -->
            <div class="space-y-2">
                <label class="block text-[10px] font-black uppercase tracking-widest text-[#556B2F] ml-1">Current Password</label>
                <input type="password" name="old_pass" required placeholder="••••••••" 
                       class="w-full px-6 py-4 bg-[#FAF8F5] border border-stone-200/60 rounded-2xl focus:outline-none focus:border-[#72A10F] focus:bg-white transition-all duration-300 focus:ring-4 focus:ring-[#72A10F]/10 text-stone-800">
            </div>

            <!-- New Password -->
            <div class="space-y-2">
                <label class="block text-[10px] font-black uppercase tracking-widest text-[#556B2F] ml-1">New Password</label>
                <input type="password" name="new_pass" required placeholder="••••••••" 
                       class="w-full px-6 py-4 bg-[#FAF8F5] border border-stone-200/60 rounded-2xl focus:outline-none focus:border-[#72A10F] focus:bg-white transition-all duration-300 focus:ring-4 focus:ring-[#72A10F]/10 text-stone-800">
            </div>

            <!-- Confirm Password -->
            <div class="space-y-2">
                <label class="block text-[10px] font-black uppercase tracking-widest text-[#556B2F] ml-1">Confirm New Password</label>
                <input type="password" name="con_pass" required placeholder="••••••••" 
                       class="w-full px-6 py-4 bg-[#FAF8F5] border border-stone-200/60 rounded-2xl focus:outline-none focus:border-[#72A10F] focus:bg-white transition-all duration-300 focus:ring-4 focus:ring-[#72A10F]/10 text-stone-800">
            </div>

            <!-- Organic Brand Submit Button -->
            <button type="submit" 
                    class="w-full py-4 bg-[#72A10F] hover:bg-[#5C830A] text-white font-extrabold uppercase tracking-widest text-xs rounded-2xl shadow-md shadow-[#72A10F]/10 transition-all duration-300 transform active:scale-95">
                Update Password
            </button>
        </form>
    </div>
</div>
{% endblock %}
