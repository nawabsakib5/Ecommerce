{% extends 'core/base.html' %}

{% block title %}Change Password{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-16 px-6">
    <div class="bg-white p-8 md:p-10 rounded-[2.5rem] border border-gray-100 shadow-2xl shadow-gray-200/50">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black text-gray-900 tracking-tight">Security</h1>
            <p class="text-gray-500 text-sm mt-2 font-medium">আপনার পাসওয়ার্ড আপডেট করুন</p>
        </div>

        <form method="POST" action="." class="space-y-5">
            {% csrf_token %}
            
            <div class="space-y-2">
                <label class="text-xs font-black uppercase tracking-widest text-gray-400 ml-1">Current Password</label>
                <input type="password" name="old_pass" required placeholder="••••••••" class="w-full px-6 py-4 bg-gray-50 border-2 border-transparent rounded-2xl focus:outline-none focus:border-teal-500 focus:bg-white transition-all">
            </div>

            <div class="space-y-2">
                <label class="text-xs font-black uppercase tracking-widest text-gray-400 ml-1">New Password</label>
                <input type="password" name="new_pass" required placeholder="••••••••" class="w-full px-6 py-4 bg-gray-50 border-2 border-transparent rounded-2xl focus:outline-none focus:border-teal-500 focus:bg-white transition-all">
            </div>

            <div class="space-y-2">
                <label class="text-xs font-black uppercase tracking-widest text-gray-400 ml-1">Confirm New Password</label>
                <input type="password" name="con_pass" required placeholder="••••••••" class="w-full px-6 py-4 bg-gray-50 border-2 border-transparent rounded-2xl focus:outline-none focus:border-teal-500 focus:bg-white transition-all">
            </div>

            <button type="submit" class="w-full py-4 bg-gray-900 hover:bg-black text-white font-black uppercase tracking-widest text-sm rounded-2xl shadow-xl transition-all transform hover:-translate-y-1 active:scale-95">
                Update Password
            </button>
        </form>
    </div>
</div>
{% endblock %}
